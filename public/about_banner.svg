<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="aboutBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </radialGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="aboutBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="aboutGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&amp;display=swap');

    .about-title {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 26px;
      font-weight: 900;
      fill: #f472b6;
      filter: drop-shadow(0 0 8px rgba(244, 114, 182, 0.6));
    }

    .about-desc {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      fill: #cbd5e1;
      line-height: 1.6;
    }

    .highlight-text {
      font-weight: 800;
      fill: #ffffff;
    }

    .accent-text {
      font-weight: 800;
      fill: #f472b6;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="216" rx="24" fill="url(#aboutBg)" stroke="url(#aboutBorder)" stroke-width="2.5" />

  <!-- Title -->
  <text x="450" y="48" text-anchor="middle" class="about-title">🌟 ABOUT DUOREVEAL 🌟</text>

  <!-- Divider -->
  <line x1="300" y1="65" x2="600" y2="65" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1.5" />

  <!-- Description Paragraphs -->
  <g class="about-desc" text-anchor="middle">
    <text x="450" y="105">
      <tspan class="highlight-text">DuoReveal</tspan> is an interactive, real-time <tspan class="accent-text">2-player secret question and answer web game</tspan>
    </text>
    <text x="450" y="130">
      designed to bring best friends, couples, and dynamic duos closer together!
    </text>
    <text x="450" y="165" font-size="13px" fill="#94a3b8">
      Enter a private room code • Lock secret answers in a vault • Click <tspan fill="#fef08a" font-weight="800">✨ REVEAL ✨</tspan> for 3D card flips, confetti &amp; Vibe Sync!
    </text>
  </g>
</svg>
