<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="headerGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </radialGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&amp;display=swap');

    .title {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 52px;
      font-weight: 900;
      fill: url(#titleGrad);
      filter: drop-shadow(0 0 15px rgba(244, 114, 182, 0.7));
      animation: pulseGlow 3s infinite ease-in-out;
    }

    .subtitle {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 20px;
      font-weight: 800;
      fill: #f1f5f9;
      letter-spacing: 0.5px;
    }

    .tagline {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 500;
      fill: #94a3b8;
    }

    .badge-text {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(244, 114, 182, 0.6)); }
      50% { filter: drop-shadow(0 0 25px rgba(244, 114, 182, 0.95)); }
    }

    @keyframes floatStar {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(15deg); }
    }

    .star {
      animation: floatStar 4s infinite ease-in-out;
    }

    .ping-dot {
      animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }
  </style>

  <!-- Outer Box -->
  <rect x="2" y="2" width="896" height="236" rx="28" fill="url(#headerGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Animated Star Left & Right -->
  <g class="star">
    <path d="M120 60 L126 75 L141 81 L126 87 L120 102 L114 87 L99 81 L114 75 Z" fill="#fef08a" />
    <path d="M780 60 L786 75 L801 81 L786 87 L780 102 L774 87 L759 81 L774 75 Z" fill="#fef08a" />
  </g>

  <!-- Title -->
  <text x="450" y="75" text-anchor="middle" class="title">✨ DuoReveal ✨</text>

  <!-- Subtitle -->
  <text x="450" y="115" text-anchor="middle" class="subtitle">🎮 Real-Time 2-Player Secret Q&amp;A &amp; Chat Game 💬</text>

  <!-- Tagline -->
  <text x="450" y="145" text-anchor="middle" class="tagline">The ultimate secret answer game for best friends, couples, and dynamic duos!</text>

  <!-- Badges Group -->
  <g transform="translate(180, 168)">
    <!-- Badge 1: PLAY NOW LIVE WEB APP -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#ec4899" />
      <text x="85" y="22" text-anchor="middle" fill="#ffffff" class="badge-text">🚀 PLAY LIVE APP</text>
    </g>

    <!-- Badge 2: 2 PLAYERS REALTIME -->
    <g transform="translate(185, 0)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#9333ea" />
      <text x="85" y="22" text-anchor="middle" fill="#ffffff" class="badge-text">🎮 2 PLAYERS SYNC</text>
    </g>

    <!-- Badge 3: 100% ONLINE -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#10b981" />
      <circle cx="28" cy="17" r="4" fill="#ffffff" />
      <text x="95" y="22" text-anchor="middle" fill="#ffffff" class="badge-text">🟢 100% ONLINE</text>
    </g>
  </g>
</svg>
