<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="stepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="stepBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&amp;display=swap');

    .section-header {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 24px;
      font-weight: 900;
      fill: #f472b6;
    }

    .node-title {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 800;
      fill: #ffffff;
    }

    .node-subtitle {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 10px;
      font-weight: 600;
      fill: #94a3b8;
    }

    .arrow {
      stroke: #ec4899;
      stroke-width: 2.5;
      stroke-dasharray: 6;
      animation: dash 2s linear infinite;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -24;
      }
    }

    .node-box {
      transition: transform 0.3s;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="256" rx="24" fill="url(#stepBg)" stroke="url(#stepBorder)" stroke-width="2.5" />

  <!-- Section Header -->
  <text x="450" y="42" text-anchor="middle" class="section-header">📖 How to Play in 3 Simple Steps</text>

  <!-- Flow Nodes Line Connectors -->
  <line x1="140" y1="95" x2="220" y2="95" class="arrow" />
  <line x1="310" y1="95" x2="390" y2="95" class="arrow" />
  <line x1="480" y1="95" x2="560" y2="95" class="arrow" />
  <line x1="650" y1="95" x2="730" y2="95" class="arrow" />

  <!-- Node 1: Join Room -->
  <g transform="translate(50, 70)" class="node-box">
    <rect width="90" height="50" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" filter="url(#nodeGlow)" />
    <text x="45" y="22" text-anchor="middle" class="node-title">1. Join Room</text>
    <text x="45" y="38" text-anchor="middle" class="node-subtitle">🔑 Code/Link</text>
  </g>

  <!-- Node 2: Player 2 Joins -->
  <g transform="translate(220, 70)" class="node-box">
    <rect width="90" height="50" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="45" y="22" text-anchor="middle" class="node-title">2. Player 2 🔓</text>
    <text x="45" y="38" text-anchor="middle" class="node-subtitle">👥 Room Unlocks</text>
  </g>

  <!-- Node 3: Ask Question -->
  <g transform="translate(390, 70)" class="node-box">
    <rect width="90" height="50" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <text x="45" y="22" text-anchor="middle" class="node-title">3. Ask Q ❓</text>
    <text x="45" y="38" text-anchor="middle" class="node-subtitle">🎡 Spin Wheel</text>
  </g>

  <!-- Node 4: Secret Answers -->
  <g transform="translate(560, 70)" class="node-box">
    <rect width="90" height="50" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="45" y="22" text-anchor="middle" class="node-title">4. Secret 🔒</text>
    <text x="45" y="38" text-anchor="middle" class="node-subtitle">Hidden Vault</text>
  </g>

  <!-- Node 5: Reveal & Chat -->
  <g transform="translate(730, 70)" class="node-box">
    <rect width="90" height="50" rx="14" fill="#be185d" stroke="#f472b6" stroke-width="2" filter="url(#nodeGlow)" />
    <text x="45" y="22" text-anchor="middle" class="node-title">5. REVEAL! ✨</text>
    <text x="45" y="38" text-anchor="middle" fill="#ffffff" class="node-subtitle">3D Flip &amp; Chat</text>
  </g>

  <!-- Step Instructions Below -->
  <g transform="translate(60, 145)" font-family="Plus Jakarta Sans, sans-serif" font-size="13px" fill="#cbd5e1">
    <text x="0" y="20"><tspan font-weight="800" fill="#f472b6">1. Enter Room:</tspan> Open <tspan fill="#38bdf8">https://duo-qa-game.vercel.app</tspan>, choose avatar, and create or enter Room Code.</text>
    <text x="0" y="45"><tspan font-weight="800" fill="#a855f7">2. Share Code:</tspan> Share directly to <tspan fill="#4ade80">WhatsApp</tspan>, Telegram, X, or copy link to invite Player 2.</text>
    <text x="0" y="70"><tspan font-weight="800" fill="#fb7185">3. Play &amp; Reveal:</tspan> Both players type secret answers and press <tspan fill="#fef08a" font-weight="800">✨ REVEAL ✨</tspan> to unveil together!</text>
  </g>
</svg>
