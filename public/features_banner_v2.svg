<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="380">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="featBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="featBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&amp;display=swap');

    .feat-header {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 24px;
      font-weight: 900;
      fill: #f472b6;
    }

    .card-title {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      fill: #ffffff;
    }

    .card-desc {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #94a3b8;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="376" rx="24" fill="url(#featBg)" stroke="url(#featBorder)" stroke-width="2.5" />

  <!-- Header Title -->
  <text x="450" y="44" text-anchor="middle" class="feat-header">🚀 GAME FEATURES SHOWCASE</text>

  <!-- 6 Grid Feature Cards with Explicit Coordinates -->

  <!-- Card 1: Room Lock Gate (x=45, y=65) -->
  <g>
    <rect x="45" y="65" width="255" height="135" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="60" y="98" class="card-title">🔒 2-Player Room Lock</text>
    <text x="60" y="124" class="card-desc">No login needed! Game features stay</text>
    <text x="60" y="142" class="card-desc">locked until Player 2 enters code to</text>
    <text x="60" y="160" class="card-desc">ensure a synchronized 2-player session.</text>
  </g>

  <!-- Card 2: Secret 3D Card Flip (x=322, y=65) -->
  <g>
    <rect x="322" y="65" width="255" height="135" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="337" y="98" class="card-title">🎭 Secret 3D Card Flip</text>
    <text x="337" y="124" class="card-desc">Both players enter secret answers.</text>
    <text x="337" y="142" class="card-desc">Clicking REVEAL flips both 3D cards</text>
    <text x="337" y="160" class="card-desc">simultaneously with celebratory confetti!</text>
  </g>

  <!-- Card 3: Vibe Match Sync (x=600, y=65) -->
  <g>
    <rect x="600" y="65" width="255" height="135" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <text x="615" y="98" class="card-title">💖 Vibe Match Sync %</text>
    <text x="615" y="124" class="card-desc">Calculates instant compatibility score</text>
    <text x="615" y="142" class="card-desc">(e.g., 98% Telepathic Bond! 💖 or</text>
    <text x="615" y="160" class="card-desc">Soulmate Energy ✨) on every reveal.</text>
  </g>

  <!-- Card 4: Spin Question Wheel (x=45, y=215) -->
  <g>
    <rect x="45" y="215" width="255" height="135" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="60" y="248" class="card-title">🎡 Spin Question Wheel</text>
    <text x="60" y="274" class="card-desc">Spin an interactive 3D Wheel of Fortune</text>
    <text x="60" y="292" class="card-desc">to pick random starter prompts across</text>
    <text x="60" y="310" class="card-desc">Fun, Deep, Couple, and Spicy categories!</text>
  </g>

  <!-- Card 5: Live Chat & Notifications (x=322, y=215) -->
  <g>
    <rect x="322" y="215" width="255" height="135" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="337" y="248" class="card-title">💬 Live Chat &amp; Notifications</text>
    <text x="337" y="274" class="card-desc">Real-time room messaging with audio</text>
    <text x="337" y="292" class="card-desc">chimes 🔔, top-screen toast banners,</text>
    <text x="337" y="310" class="card-desc">unread badges, and quick emoji drawer.</text>
  </g>

  <!-- Card 6: 4 Aesthetic Themes (x=600, y=215) -->
  <g>
    <rect x="600" y="215" width="255" height="135" rx="16" fill="#1e293b" stroke="#f472b6" stroke-width="1.5" />
    <text x="615" y="248" class="card-title">🌸 4 Aesthetic Themes</text>
    <text x="615" y="274" class="card-desc">Select aesthetics anytime:</text>
    <text x="615" y="292" class="card-desc">💕 Rose Glow | 🔮 Violet Velvet</text>
    <text x="615" y="310" class="card-desc">🌙 Cyber Neon | 🌸 Sakura Sunset</text>
  </g>
</svg>
