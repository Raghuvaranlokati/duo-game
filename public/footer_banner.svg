<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="footerBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070e" />
    </radialGradient>

    <!-- Name Glow Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&amp;display=swap');

    .creator-label {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 800;
      fill: #fb7185;
      letter-spacing: 1px;
    }

    .creator-name {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 42px;
      font-weight: 900;
      fill: url(#nameGrad);
      filter: drop-shadow(0 0 15px rgba(244, 114, 182, 0.7));
      letter-spacing: 2px;
    }

    .tagline-text {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 14px;
      font-style: italic;
      fill: #94a3b8;
    }

    .btn-text {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 900;
      fill: #ffffff;
      letter-spacing: 1px;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(236, 72, 153, 0.6)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.95)); }
    }

    .btn-group {
      animation: pulseBtn 2.5s infinite ease-in-out;
      transform-origin: center;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="216" rx="28" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="2.5" />

  <!-- Creator Section -->
  <text x="450" y="45" text-anchor="middle" class="creator-label">👑 CREATED &amp; DESIGNED BY</text>
  <text x="450" y="90" text-anchor="middle" class="creator-name">RAGHUVARAN</text>
  <text x="450" y="120" text-anchor="middle" class="tagline-text">Crafted with ❤️ for friends, couples, and dynamic duos worldwide.</text>

  <!-- Divider Line -->
  <line x1="250" y1="138" x2="650" y2="138" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1.5" />

  <!-- Call to Action Button Group -->
  <g transform="translate(260, 155)" class="btn-group">
    <rect width="380" height="42" rx="21" fill="url(#nameGrad)" />
    <text x="190" y="26" text-anchor="middle" class="btn-text">🚀 CLICK HERE TO PLAY DUOREVEAL NOW ✨</text>
  </g>
</svg>
